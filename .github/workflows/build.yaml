name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *" # tiap hari jam 11:00 WIB (04:00 UTC)
  workflow_dispatch: # bisa di-trigger manual dari Actions tab
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit & Push
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "chore: update stats [skip ci]"
          git push
